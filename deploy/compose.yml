# canvas on one server: the app, Postgres, Redis, Caddy (HTTPS) and nightly
# database backups. README: Deploying to a VPS.
#
#   bash deploy/deploy.sh      first run and every update
#
# Settings come from deploy/.env (start from deploy/.env.example). Only Caddy
# is reachable from outside, on ports 80 and 443; the database and Redis
# listen on Docker's private network only.

name: canvas

x-logging: &logging
  # Keep logs from filling the disk: 3 files of 10 MB per service.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    build:
      context: ..
      args:
        NEXT_DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
    image: canvas-app:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://canvas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/canvas
      # The Redis next to the app, unless deploy/.env sets REDIS_URL or Upstash's
      # UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN (those win).
      BUNDLED_REDIS_URL: redis://redis:6379
      # One server: live updates go from memory to the people on it, no relay needed.
      REALTIME_BUS: local
      APP_URL: ${APP_URL:-https://${DOMAIN}}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Live event streams stay open; give other requests a moment to finish.
    stop_grace_period: 10s
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: canvas
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only rate-limit counters live here, each with an expiry: a small cap is
    # plenty, and a snapshot every 5 minutes keeps them across restarts.
    command: ["redis-server", "--save", "300", "1", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: canvas
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PGDATABASE: canvas
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup/every.sh"]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
